<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora | Mi web</title>
    <link rel="stylesheet" href="../Css/style.css" />
    <link id="tema-claro" rel="stylesheet" href="../Css/claro.css" disabled />
    <script src="../../Js/script23.js"></script>
    <script src="../../Js/calculadora.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Mi web</h1>
      <nav>
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="../horario.html">Horario</a></li>
          <li><a href="../formulario.html">Formulario</a></li>
          <li class="nav-dropdown">
            <details>
              <summary aria-current="page">Ejercicios</summary>
              <ul class="dropdown-menu">
                <li><a href="../Ejercicios/index.html">Texto plano</a></li>
                <li><a href="index.html" aria-current="page">JavaScript</a></li>
              </ul>
            </details>
          </li>
          <li><a href="../Gantt.html">Gantt</a></li>
          <li><button class="theme-toggle" type="button" role="switch" aria-label="Tema claro" aria-checked="false" onclick="cambiarTema()"><span class="theme-toggle-thumb" aria-hidden="true"></span></button></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Calculadora</h2>
      <p>Realiza operaciones básicas con los botones o con el teclado.</p>

      <section class="calculadora" aria-label="Calculadora">
        <label class="sr-only" for="resultado">Resultado</label>
        <input
          class="calculadora-pantalla"
          id="resultado"
          type="text"
          value="0"
          readonly
          aria-live="polite"
          aria-label="Pantalla de la calculadora"
        />
        <table class="calculadora-teclas" role="presentation">
          <tbody>
            <tr>
              <td><button type="button" onclick="borrar()" class="tecla-especial">C</button></td>
              <td><button type="button" onclick="escribir('(')" class="tecla-operador">(</button></td>
              <td><button type="button" onclick="escribir(')')" class="tecla-operador">)</button></td>
            </tr>
            <tr>
              <td><button type="button" onclick="escribir('7')">7</button></td>
              <td><button type="button" onclick="escribir('8')">8</button></td>
              <td><button type="button" onclick="escribir('9')">9</button></td>
              <td><button type="button" onclick="escribir('/')" class="tecla-operador">÷</button></td>
            </tr>
            <tr>
              <td><button type="button" onclick="escribir('4')">4</button></td>
              <td><button type="button" onclick="escribir('5')">5</button></td>
              <td><button type="button" onclick="escribir('6')">6</button></td>
              <td><button type="button" onclick="escribir('*')" class="tecla-operador">×</button></td>
            </tr>
            <tr>
              <td><button type="button" onclick="escribir('1')">1</button></td>
              <td><button type="button" onclick="escribir('2')">2</button></td>
              <td><button type="button" onclick="escribir('3')">3</button></td>
              <td><button type="button" onclick="escribir('-')" class="tecla-operador">−</button></td>
            </tr>
            <tr>
              <td colspan="2"><button type="button" onclick="escribir('0')">0</button></td>
              <td><button type="button" onclick="escribir('.')">.</button></td>
              <td><button type="button" onclick="escribir('+')" class="tecla-operador">+</button></td>
            </tr>
            <tr>
              <td colspan="4"><button type="button" onclick="calcular()" class="tecla-igual">=</button></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <footer>
      <p>© 2024 Mi Web de Gonzalo. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
