<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
    <link rel="stylesheet" href="Css/style.css" />
  </head>
  <body>
    <header>
      <h1>Mi primer formulario</h1>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="horario.html">Horario</a></li>
          <li><a href="formulario.html" aria-current="page">Formulario</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2 class="Introform">Formulario de contacto</h2>
      <form action="">
        <fieldset>
          <legend>Datos personales</legend>
          <p>
            <label for="nombre">Nombre*:</label>
            <input type="text" id="nombre" name="nombre" required />
          </p>

          <p>
            <label for="apellido">Apellido*:</label>
            <input type="text" id="apellido" name="apellido" required />
          </p>

          <p>
            <label for="email">Email*:</label>
            <input type="email" id="email" name="email" required />
          </p>
          <p>
            <label for="contrasena">Contraseña*:</label>
            <input type="password" id="contrasena" name="contrasena" required />
          </p>
          <p>
            <label for="pagina-web">Página web:</label>
            <input type="text" id="pagina-web" name="pagina-web" required />
          </p>
          <p>
            <label for="buscar">Buscar:</label>
            <input type="text" id="buscar" name="buscar" required />
          </p>
        </fieldset>
        <fieldset>
          <legend>Valores numéricos</legend>
          <p>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="0" max="120" />
          </p>
        </fieldset>

        <fieldset>
          <legend>Fechas y horas</legend>
          <p>
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" />
          </p>

          <p>
            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora" />
          </p>

          <p>
            <label for="fechaHora">Fecha y hora:</label>
            <input type="datetime-local" id="fechaHora" name="fechaHora" />
          </p>

          <p>
            <label for="mes">Mes:</label>
            <input type="month" id="mes" name="mes" />
          </p>

          <p>
            <label for="semana">Semana:</label>
            <input type="week" id="semana" name="semana" />
          </p>
        </fieldset>

        <fieldset>
          <legend>Botones</legend>
          <input type="submit" value="Enviar formulario">
          <input type="reset" value="Limpiar formulario">
        </fieldset>
      </form>
    </main>

    <footer><p>© 2024 Mi Web de Gonzalo. <br> Todos los derechos reservados.</p></footer>
  </body>
</html>
